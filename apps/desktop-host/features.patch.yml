      name: '@deepseek-ai/dsh-plugin-market'
      config:
        indexes:
          - https://cdn.jsdelivr.net/npm/dsh-plugin-catalog/index.json
    - id: ui-plugin-market
      name: '@deepseek-ai/dsh-client-ui-plugin-market'
    - id: usage-stats
      name: '@ychris12138/dsh-usage-stats'
